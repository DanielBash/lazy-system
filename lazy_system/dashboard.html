<!doctype html>
<html><head><meta charset="utf-8"><title>lazy-system</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/date-fns@2.30.0/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.45 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
         margin: 0; background:#0f1115; color:#e5e7eb; }
  header { padding: 14px 22px; border-bottom: 1px solid #222a36;
           display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin:0; font-size: 18px; font-weight: 600; letter-spacing:0.3px; }
  main { display:grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 50px); }
  aside { border-right:1px solid #222a36; padding: 10px; overflow-y:auto; }
  .app { padding: 10px 12px; border-radius: 8px; cursor: pointer;
         display:flex; justify-content:space-between; align-items:center; }
  .app:hover { background:#1a2030; }
  .app.active { background:#1f2a44; }
  .dot { width:8px; height:8px; border-radius:50%; background:#374151; }
  .dot.up { background:#10b981; }
  section { padding: 18px 24px; overflow:auto; }
  .row { display:flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; align-items:center; }
  button { background:#1f2937; color:#e5e7eb; border:1px solid #374151;
           padding: 6px 12px; border-radius: 6px; cursor:pointer; font: inherit; }
  button:hover { background:#2b3648; }
  button.primary { border-color:#1d4ed8; }
  button.danger { border-color:#7f1d1d; }
  .card { background:#151a24; border:1px solid #222a36; border-radius:10px;
          padding: 14px 16px; }
  .card + .card { margin-top: 16px; }
  .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .chart-wrap { position: relative; height: 160px; }
  .chart-wrap.tall { height: 220px; }
  .chart-hint { color:#6b7280; font-size: 11px; margin-top: 4px; }
  pre, textarea { background:#0b0e14; border:1px solid #222a36; padding:10px;
                  font: 12px/1.4 ui-monospace,Menlo,monospace; color:#e5e7eb;
                  border-radius: 6px; box-sizing: border-box; }
  pre.logs { max-height: 360px; overflow:auto; white-space: pre-wrap; word-break: break-word; }
  textarea.script { width:100%; min-height: 220px; resize: vertical; }
  table { width:100%; border-collapse: collapse; }
  td { padding: 4px 8px; border-bottom: 1px solid #222a36; vertical-align: top; }
  small, .muted { color:#9ca3af; }
  input, select { background:#0b0e14; color:#e5e7eb; border:1px solid #374151;
                  padding:6px 8px; border-radius:6px; font: inherit; }
  .pill { background:#1f2937; padding:2px 8px; border-radius:999px; font-size:12px;
          margin-right: 4px; }
  .empty { color:#6b7280; padding: 20px; }
  .tabs { display:flex; gap:6px; margin-bottom: 10px; }
  .tabs button.active { background:#1f2a44; border-color:#1d4ed8; }
  .save-state { font-size: 12px; color:#9ca3af; margin-left: 8px; }
  .save-state.dirty { color:#f59e0b; }
  .save-state.saved { color:#10b981; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display:flex;
              align-items:center; justify-content:center; z-index: 50; }
  .modal { background:#151a24; border:1px solid #222a36; border-radius:10px;
           padding: 20px; width: min(520px, 92vw); }
  .modal h3 { margin: 0 0 12px; }
  .modal .field { margin-bottom: 10px; display:flex; flex-direction:column; gap: 4px; }
  .modal .field input { width: 100%; box-sizing: border-box; }
</style></head><body>
<header>
  <h1>lazy-system</h1>
  <div>
    <small id="auth-state" style="color:#9ca3af;margin-right:10px"></small>
    <button onclick="openSettings()">Settings</button>
  </div>
</header>
<main>
  <aside id="apps"></aside>
  <section id="detail" class="empty">Select an app on the left.</section>
</main>

<script>
const RETENTION_DAYS = 3;
const RETENTION_S = RETENTION_DAYS * 86400;

let current = null;
let charts = {};
let appsCache = [];
let scriptDirty = {};       // {kind: bool}
let scriptLoaded = {};      // {kind: lastSavedContent}
let activeScriptKind = 'run';
let lastHistorySig = '';
let pollTimer = null;

async function api(path, opts={}) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  const ct = r.headers.get('content-type')||'';
  return ct.includes('json') ? r.json() : r.text();
}

async function loadApps() {
  const apps = await api('/api/apps');
  appsCache = apps;
  const aside = document.getElementById('apps');
  aside.innerHTML = '';
  if (!apps.length) {
    aside.innerHTML = '<div class="empty">No apps yet.<br><small>lazy create &lt;name&gt;</small></div>';
    return;
  }
  for (const a of apps) {
    const el = document.createElement('div');
    el.className = 'app' + (current === a.name ? ' active' : '');
    el.innerHTML = `<span>${escapeHtml(a.name)}</span><span class="dot ${a.active?'up':''}"></span>`;
    el.onclick = () => selectApp(a.name);
    aside.appendChild(el);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[<&>"']/g, c => ({'<':'&lt;','&':'&amp;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtBytes(b) {
  if (b < 1024) return b+' B';
  if (b < 1024*1024) return (b/1024).toFixed(1)+' KB';
  if (b < 1024*1024*1024) return (b/1024/1024).toFixed(1)+' MB';
  return (b/1024/1024/1024).toFixed(2)+' GB';
}

function selectApp(name) {
  if (current === name) return;
  if (anyScriptDirty() && !confirm('Unsaved script changes will be lost. Switch app?')) return;
  current = name;
  scriptDirty = {}; scriptLoaded = {}; activeScriptKind = 'run';
  lastHistorySig = '';
  destroyCharts();
  buildSkeleton();
  loadApps();
  refreshDetail();
  loadScripts();
}

function anyScriptDirty() {
  return Object.values(scriptDirty).some(Boolean);
}

function destroyCharts() {
  for (const k in charts) charts[k].destroy();
  charts = {};
}

function buildSkeleton() {
  const a = appsCache.find(x => x.name === current) || {name: current};
  const detail = document.getElementById('detail');
  detail.className = '';
  detail.innerHTML = `
    <h2 style="margin:0 0 4px"><span id="d-name">${escapeHtml(current)}</span> <small id="d-state"></small></h2>
    <small id="d-desc"></small>
    <div class="row" style="margin-top:12px">
      <button onclick="act('start')">Start</button>
      <button onclick="act('stop')">Stop</button>
      <button onclick="act('restart')">Restart</button>
      <button class="primary" onclick="act('update')">Update now</button>
      <button class="danger" onclick="del()">Delete</button>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b>Uptime</b>
        <button onclick="resetZoom('uptime')" title="reset zoom">⤺ reset</button>
      </div>
      <div class="chart-wrap"><canvas id="uptime"></canvas></div>
      <div class="chart-hint">scroll to zoom · drag to pan · keeps up to ${RETENTION_DAYS} days</div>
      <div id="d-counts" style="margin-top:8px"></div>
    </div>
    <div class="grid2">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <b>CPU %</b>
          <button onclick="resetZoom('cpu')">⤺ reset</button>
        </div>
        <div class="chart-wrap tall"><canvas id="cpu"></canvas></div>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <b>RAM</b>
          <button onclick="resetZoom('ram')">⤺ reset</button>
        </div>
        <div class="chart-wrap tall"><canvas id="ram"></canvas></div>
      </div>
    </div>
    <div class="card">
      <div><b>Schedules</b> <span id="d-sched"></span></div>
      <div style="margin-top:8px"><b>Webhook</b> <code id="d-hook"></code></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b>Scripts</b>
        <span><span id="script-state" class="save-state"></span>
          <button class="primary" onclick="saveScript()">Save</button>
          <button onclick="reloadScript()">Reload</button>
        </span>
      </div>
      <div class="tabs" id="script-tabs">
        <button data-kind="run" class="active" onclick="switchScript('run')">run</button>
        <button data-kind="stop" onclick="switchScript('stop')">stop</button>
        <button data-kind="update" onclick="switchScript('update')">update</button>
      </div>
      <textarea id="script-area" class="script" spellcheck="false" placeholder="loading…"></textarea>
      <div class="chart-hint">edits are saved to disk; restart/update the app to take effect</div>
    </div>
    <div class="card">
      <div><b>Logs</b> <small>(last 500 lines, kept up to ${RETENTION_DAYS} days)</small></div>
      <pre id="d-logs" class="logs"></pre>
    </div>
    <div class="card">
      <b>History</b>
      <table id="d-history"></table>
    </div>
  `;
  document.getElementById('script-area').addEventListener('input', () => {
    scriptDirty[activeScriptKind] = true;
    renderSaveState();
  });
}

function makeChart(canvasId, kind, label, color) {
  const ctx = document.getElementById(canvasId);
  const opts = {
    type: kind === 'uptime' ? 'bar' : 'line',
    data: { datasets: [{
      label, data: [],
      borderColor: color, backgroundColor: kind === 'uptime' ? [] : color + '30',
      pointRadius: 0, tension: 0.25, fill: kind !== 'uptime',
      barPercentage: 1.0, categoryPercentage: 1.0,
    }]},
    options: {
      animation: false, responsive: true, maintainAspectRatio: false,
      parsing: false, normalized: true,
      plugins: {
        legend: { display: false },
        tooltip: { mode: 'nearest', intersect: false,
          callbacks: kind === 'uptime' ? {
            label: (item) => item.parsed.y > 0 ? 'up' : 'down',
          } : {},
        },
        zoom: {
          pan:  { enabled: true, mode: 'x', modifierKey: null },
          zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' },
          limits: { x: { minRange: 30 * 1000 } },
        },
      },
      scales: {
        x: { type: 'time',
             time: { tooltipFormat: 'PP HH:mm:ss', displayFormats: { minute: 'HH:mm', hour: 'HH:mm', day: 'MMM d' } },
             ticks: { color: '#9ca3af', maxTicksLimit: 8 }, grid: { color: '#1f2937' } },
        y: kind === 'uptime'
            ? { display: false, min: 0, max: 1 }
            : { beginAtZero: true, ticks: { color: '#9ca3af' }, grid: { color: '#1f2937' } },
      },
    },
  };
  return new Chart(ctx, opts);
}

function ensureCharts() {
  if (!charts.uptime) charts.uptime = makeChart('uptime', 'uptime', 'up', '#10b981');
  if (!charts.cpu)    charts.cpu    = makeChart('cpu',    'line',   'cpu%', '#60a5fa');
  if (!charts.ram)    charts.ram    = makeChart('ram',    'line',   'rss',  '#f59e0b');
}

function resetZoom(k) { if (charts[k]) charts[k].resetZoom(); }

function updateChart(chart, points, valueFn, opts={}) {
  const ds = chart.data.datasets[0];
  ds.data = points.map(p => ({ x: p.t * 1000, y: valueFn(p) }));
  if (opts.barColors) {
    ds.backgroundColor = points.map(p => p.active ? '#10b981' : '#ef4444');
    ds.borderColor = ds.backgroundColor;
  }
  chart.update('none');
}

async function refreshDetail() {
  if (!current) return;
  const name = current;
  let metrics, history, logs;
  try {
    [metrics, history, logs] = await Promise.all([
      api(`/api/${name}/metrics`),
      api(`/api/${name}/history`),
      api(`/api/${name}/logs?n=500`),
    ]);
  } catch (e) { return; }
  if (current !== name) return;

  // filter to retention window (defensive: server already trims, but be safe)
  const cutoff = Date.now()/1000 - RETENTION_S;
  metrics = metrics.filter(m => m.t >= cutoff);
  history = history.filter(h => h.t >= cutoff);

  const a = appsCache.find(x => x.name === name) || {};
  const stateEl = document.getElementById('d-state');
  if (stateEl) {
    stateEl.style.color = a.active ? '#10b981' : '#9ca3af';
    stateEl.textContent = a.active ? 'running' : 'stopped';
  }
  const desc = document.getElementById('d-desc');
  if (desc) desc.textContent = `${a.description || ''}${a.shell ? ' · shell: ' + a.shell : ''}`;

  const sched = (a.schedules || []).map(s => `<span class="pill">${escapeHtml(s.spec)}</span>`).join('') || '<small>none</small>';
  const schedEl = document.getElementById('d-sched');
  if (schedEl) schedEl.innerHTML = sched;
  const hookEl = document.getElementById('d-hook');
  if (hookEl) {
    hookEl.textContent = a.webhook_enabled
      ? `${location.origin}${a.webhook_path}?action=update`
      : 'disabled';
  }

  ensureCharts();
  updateChart(charts.uptime, metrics, p => p.active ? 1 : 0, { barColors: true });
  updateChart(charts.cpu, metrics, p => p.cpu);
  updateChart(charts.ram, metrics, p => p.rss / 1024 / 1024);

  const evs = history.reduce((m,h)=> (m[h.event]=(m[h.event]||0)+1, m), {});
  const counts = document.getElementById('d-counts');
  if (counts) {
    counts.innerHTML = `<small>restarts: ${evs.restart||0} · failures: ${evs.exit||0} · updates: ${evs.update_ok||0} (${evs.update_failed||0} failed) · webhooks: ${evs.webhook||0}</small>`;
  }

  // logs: only update if changed; preserve scroll if user scrolled up
  const logsEl = document.getElementById('d-logs');
  if (logsEl && logsEl.dataset.content !== logs) {
    const atBottom = logsEl.scrollTop + logsEl.clientHeight >= logsEl.scrollHeight - 8;
    const prevTop = logsEl.scrollTop;
    logsEl.textContent = logs;
    logsEl.dataset.content = logs;
    logsEl.scrollTop = atBottom ? logsEl.scrollHeight : prevTop;
  }

  // history: only re-render if changed
  const sig = history.length + ':' + (history.length ? history[history.length-1].t : 0);
  if (sig !== lastHistorySig) {
    lastHistorySig = sig;
    const tbl = document.getElementById('d-history');
    if (tbl) {
      tbl.innerHTML = history.slice().reverse().slice(0, 80)
        .map(h => `<tr><td><small>${new Date(h.t*1000).toLocaleString()}</small></td><td>${escapeHtml(h.event)}</td><td><small>${escapeHtml(h.detail||'')}</small></td></tr>`).join('');
    }
  }
}

async function loadScripts() {
  if (!current) return;
  try {
    const all = await api(`/api/${current}/scripts`);
    for (const k of ['run','stop','update']) {
      scriptLoaded[k] = (all[k] && all[k].content) || '';
      scriptDirty[k] = false;
    }
  } catch (e) {
    return;
  }
  showActiveScript();
}

function showActiveScript() {
  const ta = document.getElementById('script-area');
  if (!ta) return;
  ta.value = scriptLoaded[activeScriptKind] ?? '';
  for (const btn of document.querySelectorAll('#script-tabs button')) {
    btn.classList.toggle('active', btn.dataset.kind === activeScriptKind);
  }
  renderSaveState();
}

function switchScript(kind) {
  if (kind === activeScriptKind) return;
  // stash current edits if dirty
  const ta = document.getElementById('script-area');
  if (ta && scriptDirty[activeScriptKind]) scriptLoaded[activeScriptKind] = ta.value;
  activeScriptKind = kind;
  showActiveScript();
}

function renderSaveState() {
  const el = document.getElementById('script-state');
  if (!el) return;
  const dirty = scriptDirty[activeScriptKind];
  el.textContent = dirty ? 'unsaved' : 'saved';
  el.className = 'save-state ' + (dirty ? 'dirty' : 'saved');
}

async function saveScript() {
  if (!current) return;
  const ta = document.getElementById('script-area');
  const content = ta.value;
  const kind = activeScriptKind;
  try {
    await api(`/api/${current}/script/${kind}`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ content }),
    });
    scriptLoaded[kind] = content;
    scriptDirty[kind] = false;
    renderSaveState();
  } catch (e) {
    alert('save failed: ' + e.message);
  }
}

async function reloadScript() {
  if (scriptDirty[activeScriptKind] && !confirm('Discard unsaved changes?')) return;
  try {
    const data = await api(`/api/${current}/script/${activeScriptKind}`);
    scriptLoaded[activeScriptKind] = data.content || '';
    scriptDirty[activeScriptKind] = false;
    showActiveScript();
  } catch (e) { alert('reload failed: ' + e.message); }
}

async function act(action) {
  if (!current) return;
  await api(`/api/${current}/${action}`, {method:'POST'});
  setTimeout(refreshDetail, 500);
}

async function del() {
  const name = current;
  if (!name) return;
  const typed = prompt(`Permanently delete "${name}"?\n\nThis stops the service, removes its systemd units, scripts, metrics, and history.\n\nType the app name to confirm:`);
  if (typed !== name) return;
  await api(`/api/${name}/delete`, {method:'POST'});
  current = null;
  destroyCharts();
  document.getElementById('detail').className = 'empty';
  document.getElementById('detail').innerHTML = `Deleted "${escapeHtml(name)}".`;
  loadApps();
}

async function openSettings() {
  let cfg;
  try { cfg = await api('/api/config'); }
  catch (e) { alert('failed to load config: ' + e.message); return; }
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal" onclick="event.stopPropagation()">
      <h3>Settings</h3>
      <div class="field"><label>Web port</label><input id="cfg-port" type="number" value="${cfg.webhook_port}"></div>
      <div class="field"><label>Bind address</label><input id="cfg-bind" value="${escapeHtml(cfg.web_bind)}"></div>
      <div class="field"><label>Web username</label><input id="cfg-user" value="${escapeHtml(cfg.web_user)}"></div>
      <div class="field"><label>Default shell (auto / bash / fish)</label><input id="cfg-shell" value="${escapeHtml(cfg.shell)}"></div>
      <div class="field"><label>Metrics interval (seconds)</label><input id="cfg-interval" type="number" value="${cfg.metrics_interval_seconds}"></div>
      <div class="field"><label>Retention (days)</label><input id="cfg-ret" type="number" value="${cfg.retention_days ?? 3}"></div>
      <div class="field"><label>Log max bytes</label><input id="cfg-logbytes" type="number" value="${cfg.log_max_bytes ?? 10485760}"></div>
      <div class="field"><label><input id="cfg-savelogs" type="checkbox" ${cfg.save_logs ? 'checked' : ''}> save logs to file</label></div>
      <small>Password and per-app fields stay in the TUI.</small>
      <div class="row" style="justify-content:flex-end;margin-top:14px">
        <button onclick="closeModal()">Cancel</button>
        <button class="primary" onclick="saveSettings()">Save</button>
      </div>
    </div>
  `;
  bg.onclick = closeModal;
  document.body.appendChild(bg);
}

function closeModal() {
  document.querySelectorAll('.modal-bg').forEach(e => e.remove());
}

async function saveSettings() {
  const body = {
    webhook_port: parseInt(document.getElementById('cfg-port').value, 10),
    web_bind: document.getElementById('cfg-bind').value.trim(),
    web_user: document.getElementById('cfg-user').value.trim(),
    shell: document.getElementById('cfg-shell').value.trim() || 'auto',
    metrics_interval_seconds: Math.max(1, parseInt(document.getElementById('cfg-interval').value, 10) || 5),
    retention_days: Math.max(0, parseInt(document.getElementById('cfg-ret').value, 10) || 3),
    log_max_bytes: Math.max(0, parseInt(document.getElementById('cfg-logbytes').value, 10) || 0),
    save_logs: document.getElementById('cfg-savelogs').checked,
  };
  try {
    await api('/api/config', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });
    closeModal();
    refreshAuthState();
  } catch (e) {
    alert('save failed: ' + e.message);
  }
}

async function refreshAuthState() {
  try {
    const cfg = await api('/api/config');
    document.getElementById('auth-state').textContent =
      cfg.web_password ? `signed in as ${cfg.web_user}` : 'no password set (loopback only)';
  } catch (e) {}
}

function poll() {
  loadApps();
  if (current) refreshDetail();
}

loadApps();
refreshAuthState();
pollTimer = setInterval(poll, 5000);
</script>
</body></html>
